name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Release audit
        run: python tools/audit_release.py .
      - name: README link check
        run: python tools/check_readme_links.py .

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build weightless App source
        run: swift build -c release --product LLVNRDemo
        working-directory: demo
